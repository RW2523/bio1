seed: 42
device: null
dataset_root: wisdm-dataset
device_type: watch
sensor: accel
sample_rate: 20
resample_rate: null
window_seconds: 10
stride_seconds: 5
num_classes: 18
batch_size: 128
num_workers: 4

# ── training ──────────────────────────────────────────────────────────────
epochs_linear_probe: 150      # Cases 1 & 2 (frozen backbone + linear head)
epochs_case3_mlp: 150         # Case 3 (frozen backbone + MLP head)
epochs_pretrain: 300          # SimCLR contrastive pretrain
patience: 22                  # default early-stop (overridden by probe.patience)
patience_pretrain: 45        # SSL patience
min_epochs_pretrain: 50      # never stop SSL before this many epochs

lr_head: 4.0e-3               # Cases 1 & 2 linear head LR
lr_case3_mlp: 4.0e-3          # Case 3 MLP head LR
lr_pretrain: 5.0e-4          # legacy key; SimCLR uses lr_simclr
lr_simclr: 5.0e-4           # SimCLR AdamW LR (projector + backbone)
weight_decay: 1.0e-4
grad_clip: 1.0
amp: true

limit_subjects: null
max_windows: null
epochs: null

# ── paths ──────────────────────────────────────────────────────────────────
processed_path: snn_ssl_wisdm/processed/wisdm_watch_accel_10s.pt
splits_path: snn_ssl_wisdm/processed/splits_seed42.json

# ── spiking neuron ─────────────────────────────────────────────────────────
spiking:
  timesteps: 4
  beta: 0.5           # tau = 1/(1-beta) = 2 → SpikingJelly: v += x/tau
  threshold: 0.5      # healthy firing on N(0,1) BN features
  detach_reset: true

# ── model ──────────────────────────────────────────────────────────────────
model:
  base_channels: 64
  layers: [2, 2, 2, 2]
  feature_dim: 512
  in_channels: 3

# ── frozen probe training (all cases) ─────────────────────────────────────
probe:
  label_smoothing: 0.08
  mixup_alpha: 0.28           # 0 disables MixUp
  train_noise_std: 0.045      # additive Gaussian on normalised windows (train only)
  tta_passes: 10              # test-time logit average (1 = off)
  tta_noise_std: 0.018        # noise std for extra TTA views
  min_epochs: 22              # early-stop guard
  patience: 28                # early-stop patience (val balanced accuracy)

# ── case3: frozen backbone + deeper MLP head ────────────────────────────────
head:
  type: mlp
  hidden_dim: 512
  hidden_dim2: 256
  dropout: 0.18

# ── output ─────────────────────────────────────────────────────────────────
output_root: outputs

# ── SimCLR contrastive SSL (replaces AugPred in the default pipeline) ───────
simclr:
  temperature: 0.15           # NT-Xent temperature (lower = sharper)
  projector_hidden: 2048
  projector_out: 128
  aug_noise_std: 0.085        # Gaussian noise (train views)
  aug_scale_lo: 0.72
  aug_scale_hi: 1.32
  aug_reverse_prob: 0.5
  aug_time_warp_prob: 0.55
  aug_time_warp_strength: 0.22
  aug_channel_drop_prob: 0.12
  val_noise_std: 0.012        # tiny noise for val views (two weak augmentations)

# Optional: AugPred script ``pretrain_augpred_snn.py`` still reads ``augpred:`` if you switch back.
augpred:
  num_perm_chunks: 4
  time_warp_strength: 0.22
  input_noise_std: 0.028
